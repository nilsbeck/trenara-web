# Nothing told this project when one of its pinned dependencies acquired an
# advisory. Several majors are pinned exactly and deliberately —
# @sveltejs/kit, adapter-vercel, @testing-library/svelte — which is the right
# call and also the reason an update has to be raised rather than drifted into.
#
# Monthly and grouped, so this is a pull request to read once a month rather
# than a stream of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native rewrite, and nothing else here can talk to
      # it yet: svelte-check refuses to run without a side-by-side TypeScript 6
      # and a --tsgo flag, and typescript-eslint rejects it outright
      # (typescript-eslint/typescript-eslint#10940). Both have to land before
      # the major is worth raising, so it is not raised. Minor and patch
      # updates still come through, and this entry comes back out once
      # typescript-eslint supports TS >=7.1.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-*'
          - '@sveltejs/*'
          - 'eslint-plugin-svelte'
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript*'
          - '@typescript-eslint/*'
          - 'prettier*'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
      runtime:
        patterns:
          - '@supabase/*'
          - 'zod'
          - 'dompurify'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'lucide-svelte'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
