name: Check

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test & build
    runs-on: ubuntu-latest

    # Placeholders, not secrets. Nothing here reaches Trenara or Supabase: the
    # type-checker and the unit tests mock every module that would, and the
    # build only needs the variables to resolve at import time.
    env:
      BASIC_BEARER_TOKEN: placeholder
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      # Was not run at all, so a formatting or lint regression landed silently.
      # Now that eslint can see .svelte files, this covers the UI too.
      - name: Lint
        run: bun run lint

      # Coverage rather than a plain `test`: the 80% thresholds in
      # vitest.config.ts were configured and never executed by anything, which
      # made them decorative. This is what turns them into a gate.
      - name: Test with coverage
        run: bun run test:coverage

      # A broken production build used to be discovered by Vercel, which is a
      # slow way to find out — and agents.md records that branches are tried as
      # preview deployments rather than locally, so it was the *only* way.
      - name: Build
        run: bun run build
