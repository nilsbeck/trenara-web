<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline — Trainara</title>
		<!--
			Everything inline and no script at all.

			Inline because this page is shown precisely when nothing more can be
			fetched, so a stylesheet reference would be a blank page with words on
			it. No script because the app sets `script-src: self` and, more to the
			point, a reload button that is a plain link needs none.

			The palette is copied from the `@theme` block in `src/app.css` rather
			than imported, for the same reason.
		-->
		<style>
			:root {
				color-scheme: dark;
				--background: hsl(220 18% 12%);
				--foreground: hsl(220 14% 90%);
				--muted-foreground: hsl(220 12% 60%);
				--border: hsl(220 17% 26%);
				--secondary: hsl(220 17% 20%);
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 3rem 1.5rem;
				background: var(--background);
				color: var(--foreground);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}

			main {
				width: 100%;
				max-width: 22rem;
				text-align: center;
			}

			.mark {
				width: 3.5rem;
				height: 3.5rem;
				margin: 0 auto 1.5rem;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 9999px;
				background: var(--secondary);
			}

			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.25rem;
				font-weight: 600;
				letter-spacing: -0.01em;
			}

			p {
				margin: 0 0 0.75rem;
				font-size: 0.875rem;
				line-height: 1.5;
				color: var(--muted-foreground);
			}

			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				margin-top: 0.75rem;
				padding: 0.5rem 1rem;
				border: 1px solid var(--border);
				border-radius: 0.375rem;
				color: var(--foreground);
				font-size: 0.875rem;
				font-weight: 500;
				text-decoration: none;
			}

			a:hover {
				background: var(--secondary);
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark" aria-hidden="true">
				<!-- A cloud with a slash: the same idea as the error page's icon. -->
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="28"
					height="28"
					viewBox="0 0 24 24"
					fill="none"
					stroke="hsl(220 12% 60%)"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<path d="m2 2 20 20" />
					<path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193" />
					<path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07" />
				</svg>
			</div>

			<h1>You're offline</h1>
			<p>
				Trainara needs a connection to read your plan from Trenara, and there isn't one right now.
			</p>
			<!--
				Said plainly, because the alternative reading is the frightening one:
				a runner who cannot see their plan may wonder whether it is gone.
			-->
			<p>Nothing has been lost. Your training is on Trenara's servers, waiting.</p>

			<a href="/dashboard">Try again</a>
		</main>
	</body>
</html>
